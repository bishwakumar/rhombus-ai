<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rhombus AI under drift</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --paper: #F6F7F9;
      --surface: #FFFFFF;
      --ink: #1B2230;
      --muted: #5E6878;
      --line: #DDE1E7;
      --good: #1E7F63;
      --good-soft: #E3F2EC;
      --bad: #C23A3A;
      --bad-soft: #F8E5E5;
      --stop: #5B6B8C;
      --stop-soft: #E7EAF1;
      --gap: #C9CFD8;
      --warn: #A86A12;
      --warn-soft: #F6ECDA;
      --accent: #2F4BBF;
      --font: "Schibsted Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 15px/1.55 var(--font);
      font-variant-numeric: tabular-nums;
    }

    a {
      color: var(--accent);
      text-underline-offset: 2px;
    }

    a:focus-visible,
    button:focus-visible,
    summary:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 3px;
    }

    code {
      font-size: 0.92em;
    }

    .wrap {
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 28px;
    }

    /* Top bar */
    header.top {
      border-bottom: 1px solid var(--line);
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 5;
    }

    header.top .wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      height: 56px;
    }

    .brand {
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    nav {
      display: flex;
      gap: 22px;
      font-size: 14px;
      overflow-x: auto;
    }

    nav a {
      color: var(--muted);
      text-decoration: none;
      white-space: nowrap;
    }

    nav a:hover {
      color: var(--ink);
    }

    /* Hero */
    .hero {
      padding: 56px 0 40px;
    }

    .hero h1 {
      font-size: clamp(28px, 4.2vw, 44px);
      line-height: 1.12;
      letter-spacing: -0.02em;
      font-weight: 700;
      margin: 0 0 14px;
      max-width: 24ch;
    }

    .hero p.sub {
      color: var(--muted);
      max-width: 66ch;
      margin: 0 0 30px;
      font-size: 16px;
    }

    .strip {
      display: flex;
      flex-wrap: wrap;
      gap: 22px 26px;
      align-items: flex-start;
    }

    .strip .group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .strip .marks {
      display: flex;
      gap: 4px;
    }

    .mark {
      width: 22px;
      height: 34px;
      border-radius: 3px;
      display: block;
    }

    .mark.correct {
      background: var(--good);
    }

    .mark.wrong {
      background: var(--bad);
    }

    .mark.stopped {
      background: var(--stop);
    }

    .strip .name {
      font-size: 12.5px;
      color: var(--muted);
      max-width: 12ch;
      line-height: 1.25;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 18px;
      margin-top: 18px;
      font-size: 13px;
      color: var(--muted);
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .legend i {
      width: 12px;
      height: 12px;
      border-radius: 2px;
      display: inline-block;
    }

    .facts {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 34px;
      margin-top: 30px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
      font-size: 14px;
      color: var(--muted);
    }

    .facts b {
      color: var(--ink);
      font-weight: 600;
    }

    /* Sections */
    section {
      padding: 44px 0 8px;
      scroll-margin-top: 64px;
    }

    h2 {
      font-size: 22px;
      letter-spacing: -0.01em;
      margin: 0 0 6px;
    }

    .lede {
      color: var(--muted);
      margin: 0 0 22px;
      max-width: 70ch;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
    }

    .scroll {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th {
      text-align: left;
      font-weight: 500;
      color: var(--muted);
      font-size: 13px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
    }

    td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      vertical-align: middle;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    tr.groupRow td {
      background: var(--paper);
      color: var(--muted);
      font-size: 12.5px;
      font-weight: 600;
      padding: 8px 16px;
    }

    .scen b {
      font-weight: 600;
    }

    .scen div {
      color: var(--muted);
      font-size: 13px;
    }

    .num {
      text-align: right;
      white-space: nowrap;
    }

    .bar {
      display: flex;
      height: 12px;
      width: 180px;
      border-radius: 3px;
      overflow: hidden;
      background: var(--paper);
    }

    .bar span {
      height: 100%;
    }

    .bar .correct {
      background: var(--good);
    }

    .bar .wrong {
      background: var(--bad);
    }

    .bar .stopped {
      background: var(--stop);
    }

    .bar .gap {
      background: repeating-linear-gradient(45deg, var(--gap) 0 3px, transparent 3px 6px);
    }

    .tag {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 500;
      white-space: nowrap;
    }

    .tag.handled {
      background: var(--good-soft);
      color: var(--good);
    }

    .tag.missed {
      background: var(--bad-soft);
      color: var(--bad);
    }

    .tag.breaks,
    .tag.silent_drop {
      background: var(--warn-soft);
      color: var(--warn);
    }

    /* Heat map */
    .heat td.cell {
      text-align: center;
      font-size: 13px;
      font-weight: 500;
    }

    .cell.good {
      background: var(--good-soft);
      color: var(--good);
    }

    .cell.bad {
      background: var(--bad-soft);
      color: var(--bad);
    }

    .cell.neutral {
      color: var(--muted);
    }

    /* Consistency */
    .cons {
      display: grid;
      gap: 14px;
    }

    .consRow {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 16px 18px;
    }

    .consHead {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px 20px;
    }

    .consHead b {
      font-weight: 600;
    }

    .runs {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .runs span {
      font-size: 12.5px;
      padding: 3px 9px;
      border-radius: 6px;
      border: 1px solid var(--line);
      color: var(--muted);
    }

    .runs span.same {
      border-color: var(--good);
      color: var(--good);
    }

    .runs span.odd {
      border-color: var(--warn);
      color: var(--warn);
    }

    .consRow p {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    details.diff {
      margin-top: 12px;
    }

    details.diff summary {
      cursor: pointer;
      color: var(--accent);
      font-size: 14px;
    }

    .diffTable {
      margin-top: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }

    .diffTable td,
    .diffTable th {
      padding: 8px 12px;
      font-size: 13px;
    }

    .diffTable .l {
      background: var(--bad-soft);
    }

    .diffTable .r {
      background: var(--good-soft);
    }

    .short {
      color: var(--muted);
      font-size: 14px;
      margin-top: 14px;
    }

    /* Time */
    .timeRow {
      display: grid;
      grid-template-columns: 170px 1fr 70px;
      align-items: center;
      gap: 14px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--line);
    }

    .timeRow .label {
      font-size: 14px;
    }

    .timeRow.base .label {
      font-weight: 600;
    }

    .track {
      position: relative;
      height: 22px;
    }

    .track::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 1px;
      background: var(--line);
    }

    .dot {
      position: absolute;
      top: 50%;
      width: 10px;
      height: 10px;
      margin: -5px 0 0 -5px;
      border-radius: 50%;
      background: var(--stop);
      opacity: .6;
    }

    .med {
      position: absolute;
      top: 2px;
      bottom: 2px;
      width: 3px;
      margin-left: -1.5px;
      border-radius: 2px;
      background: var(--ink);
    }

    .timeRow.base .dot {
      background: var(--accent);
    }

    .axis {
      display: grid;
      grid-template-columns: 170px 1fr 70px;
      gap: 14px;
      padding: 8px 16px 12px;
      font-size: 12px;
      color: var(--muted);
    }

    .axis .ticks {
      display: flex;
      justify-content: space-between;
    }

    .note {
      font-size: 13.5px;
      color: var(--muted);
      margin-top: 12px;
      max-width: 75ch;
    }

    /* Videos */
    .vids {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 18px;
    }

    .vid {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px;
    }

    .vid b {
      font-weight: 600;
    }

    .vid div {
      color: var(--muted);
      font-size: 13.5px;
      margin: 2px 0 10px;
    }

    .vid video {
      width: 100%;
      border-radius: 6px;
      background: #000;
      display: block;
    }

    .recsTitle {
      margin: 22px 0 8px;
      font-size: 14px;
      color: var(--muted);
    }

    .recs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .recs button {
      font: inherit;
      font-size: 13.5px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 12px;
      cursor: pointer;
      color: var(--ink);
    }

    .recs button:hover {
      border-color: var(--accent);
    }

    dialog {
      border: 0;
      border-radius: 12px;
      padding: 16px;
      width: min(900px, 94vw);
    }

    dialog::backdrop {
      background: rgba(27, 34, 48, .55);
    }

    dialog video {
      width: 100%;
      border-radius: 6px;
      background: #000;
    }

    dialog .dh {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    dialog button {
      font: inherit;
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 8px;
      padding: 5px 12px;
      cursor: pointer;
    }

    /* All runs */
    details.all summary {
      cursor: pointer;
      font-weight: 600;
      font-size: 16px;
      padding: 4px 0;
    }

    .vtag {
      font-size: 12.5px;
      font-weight: 500;
    }

    .vtag.PASS {
      color: var(--good);
    }

    .vtag.FAIL {
      color: var(--bad);
    }

    .vtag.STOPPED {
      color: var(--stop);
    }

    footer {
      padding: 40px 0 56px;
      color: var(--muted);
      font-size: 13px;
    }

    .err {
      padding: 80px 0;
      color: var(--muted);
    }

    @media (max-width: 720px) {
      .wrap {
        padding: 0 18px;
      }

      nav {
        display: none;
      }

      .timeRow,
      .axis {
        grid-template-columns: 110px 1fr 54px;
      }

      .bar {
        width: 120px;
      }
    }
  </style>
</head>

<body>
  <header class="top">
    <div class="wrap">
      <div class="brand">Rhombus AI under drift</div>
      <nav aria-label="Sections">
        <a href="#health">Pipeline health</a>
        <a href="#consistency">Consistency</a>
        <a href="#heat">Capability map</a>
        <a href="#time">Time</a>
        <a href="#videos">Videos</a>
      </nav>
    </div>
  </header>

  <main id="app" class="wrap">
    <p class="err">Loading results…</p>
  </main>

  <dialog id="player" aria-label="Test recording">
    <div class="dh"><b id="playerTitle"></b><button id="playerClose">Close</button></div>
    <video id="playerVideo" controls></video>
  </dialog>

  <script>
    const WALKTHROUGHS = [
      {
        title: "UI tests walkthrough", about: "The Playwright journey: source, AI-built pipeline, GCS destination, schedule and known issues.",
        url: "https://storage.googleapis.com/rhombus-test-videos/ui-test-video.mp4"
      },
      {
        title: "API tests walkthrough", about: "Backend checks: what works, security refusals, and known issues confirmed through the API.",
        url: "https://storage.googleapis.com/rhombus-test-videos/api-test-video.mp4"
      },
    ];
    const GROUPS = { baseline: "Baseline", schema: "Schema drift", combined: "Combined drift", semantic: "Semantic drift" };
    const VERDICT = { handled: "Handled", missed: "Missed", breaks: "Breaks", silent_drop: "Silent drop" };
    const WORDS = ["None", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight"];
    const median = a => { const v = [...a].sort((x, y) => x - y), m = v.length >> 1; return v.length % 2 ? v[m] : +((v[m - 1] + v[m]) / 2).toFixed(1); };
    const cap = t => t ? t[0].toUpperCase() + t.slice(1) : t;
    /* Readable title for a recording whose file name isn't in build.py's list. */
    const recTitle = v => {
      let t = v.title || "";
      if (!/^[a-z0-9 ]+$/.test(t)) return t;
      t = t.replace(/^\d+ (source connection|ai built pipeline|gcs destination|schedule|known issues( confirmed still present)?) /, "");
      t = t.replace(/\bf(\d+)\b/g, "F$1:").replace(/\bs3\b/g, "S3").replace(/\bgcs\b/g, "GCS").replace(/\bui\b/g, "UI");
      return cap(t);
    };
    const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const runName = f => esc(String(f).replace(/^.*__/, "").replace(".csv", "").replace("run", "Run "));

    /* What actually happened to the data in one run. */
    function classify(run, scenario) {
      if (run.output_file && /^PASS/.test(run.verdict || "")) return "correct";
      if (run.output_file && run.verdict === "FAIL") return "wrong";
      if (run.rhombus_error || /^Stopped/i.test(scenario.rhombus || "")) return "stopped";
      return "gap";   // no output captured: setup attempts and runner timeouts, not a Rhombus result
    }
    function tally(s) {
      const t = { correct: 0, wrong: 0, stopped: 0, gap: 0 };
      s.runs.forEach(r => t[classify(r, s)]++);
      return t;
    }

    function hero(D) {
      let correct = 0, wrong = 0;
      const groups = D.scenarios.map(s => {
        const kinds = s.runs.map(r => classify(r, s));
        const shown = kinds.filter(k => k === "correct" || k === "wrong");
        if (kinds.includes("stopped")) shown.push("stopped");
        shown.forEach(k => { if (k === "correct") correct++; if (k === "wrong") wrong++; });
        return { label: s.label, shown };
      });
      const delivered = correct + wrong;
      const silent = D.heat.filter(h => h.silent_success && !h.data_correct).length;
      // const updated = new Date(D.generated_at).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
      return `
    <div class="hero">
      <h1>Rhombus stops on missing columns, but lets every other data change through.</h1>
      <p class="sub">Of ${delivered} runs that delivered a file, ${wrong} had wrong data, and Rhombus marked all ${delivered} as successful. Eight scenarios were tested: a baseline, four schema changes, all four combined, and two changes in meaning. No run raised a warning.</p>
      <div class="strip" role="img" aria-label="${delivered} runs delivered a file: ${correct} correct, ${wrong} wrong">
        ${groups.map(g => `<div class="group"><div class="marks">${g.shown.map(k => `<i class="mark ${k}"></i>`).join("")}</div><div class="name">${esc(g.label)}</div></div>`).join("")}
      </div>
      <div class="legend">
        <span><i style="background:var(--good)"></i>File delivered, data correct</span>
        <span><i style="background:var(--bad)"></i>File delivered, data wrong</span>
        <span><i style="background:var(--stop)"></i>Pipeline stopped</span>
      </div>
      <div class="facts">
        <span><b>${D.suites.api.pass}/${D.suites.api.total}</b> API tests pass</span>
        <span><b>${D.suites.ui.pass}/${D.suites.ui.total}</b> UI tests pass</span>
        <span>Original pipeline code <b>${esc(D.code_sha_original)}</b></span>
      </div>
    </div>`;
    }

    function health(D) {
      let rows = "", last = "";
      D.scenarios.forEach(s => {
        if (s.group !== last && s.group !== "baseline") rows += `<tr class="groupRow"><td colspan="5">${esc(GROUPS[s.group] || s.group)}</td></tr>`;
        last = s.group;
        const t = tally(s), known = t.correct + t.wrong + t.stopped, all = known + t.gap || 1;
        const seg = (n, cls) => n ? `<span class="${cls}" style="width:${(n / all) * 100}%"></span>` : "";
        const success = known ? Math.round(((t.correct + t.wrong) / known) * 100) : 0;
        const files = t.correct + t.wrong;
        const correctCell = files ? `${Math.round((t.correct / files) * 100)}%` : `<span style="color:var(--muted)">no file</span>`;
        rows += `<tr>
      <td class="scen"><b>${esc(s.label)}</b><div>${esc(s.drift)}</div></td>
      <td><div class="bar" title="${t.correct} correct, ${t.wrong} wrong, ${t.stopped} stopped, ${t.gap} not captured">${seg(t.correct, "correct")}${seg(t.wrong, "wrong")}${seg(t.stopped, "stopped")}${seg(t.gap, "gap")}</div></td>
      <td class="num">${success}%</td>
      <td class="num">${correctCell}</td>
      <td><span class="tag ${esc(s.capability)}">${esc(VERDICT[s.capability] || s.headline)}</span></td>
    </tr>`;
      });
      return `
    <section id="health">
      <h2>Pipeline health by scenario</h2>
      <p class="lede">Every run, split by what happened to the data. Reported success is how often Rhombus completed the run; data correct is how often a delivered file matched the known right answer.</p>
      <div class="panel scroll"><table>
        <thead><tr><th>Scenario</th><th>Runs</th><th class="num">Reported success</th><th class="num">Data correct</th><th>Rhombus</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
      <div class="legend">
        <span><i style="background:var(--good)"></i>Correct</span>
        <span><i style="background:var(--bad)"></i>Success, wrong data</span>
        <span><i style="background:var(--stop)"></i>Stopped</span>
        <span><i style="background:repeating-linear-gradient(45deg,var(--gap) 0 3px,transparent 3px 6px)"></i>No output captured (setup attempts, left out of the rates)</span>
      </div>
    </section>`;
    }

    function consistency(D) {
      const compared = D.scenarios.filter(s => s.consistency.captured_outputs >= 2);
      const notEnough = D.scenarios.filter(s => s.consistency.captured_outputs < 2).map(s => esc(s.label));
      const cards = compared.map(s => {
        const c = s.consistency;
        const outRuns = s.runs.filter(r => r.output_md5);
        const counts = {};
        outRuns.forEach(r => counts[r.output_md5] = (counts[r.output_md5] || 0) + 1);
        const common = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0];
        const runTags = outRuns.map(r => `<span class="${r.output_md5 === common ? "same" : "odd"}">Run ${r.run}</span>`).join("");
        const codeChanged = c.variance && /patch|code/i.test(c.capture_note || "");
        const status = !c.variance
          ? `<b style="color:var(--good)">Identical across ${c.captured_outputs} runs</b>`
          : codeChanged
            ? `<b style="color:var(--warn)">${c.unique_md5s} versions: code changed between runs</b>`
            : `<b style="color:var(--bad)">Varied: ${c.unique_md5s} different outputs</b>`;
        const d = (c.comparisons || []).find(x => !x.identical && x.samples && x.samples.length);
        const diff = d ? `
      <details class="diff" open><summary>${runName(d.left)} vs ${runName(d.right)}: ${d.differing_rows} of ${d.rows_left} rows differ</summary>
        <div class="diffTable scroll"><table>
          <thead><tr><th>Order</th><th>Column</th><th>${runName(d.left)}</th><th>${runName(d.right)}</th></tr></thead>
          <tbody>${d.samples.slice(0, 5).flatMap(r => r.cells.map(cell => `<tr><td>${esc(r.order_id)}</td><td>${esc(cell.col)}</td><td class="l">${esc(cell.left) || "<i>blank</i>"}</td><td class="r">${esc(cell.right) || "<i>blank</i>"}</td></tr>`)).join("")}</tbody>
        </table></div>
      </details>` : "";
        return `<div class="consRow">
      <div class="consHead"><b>${esc(s.label)}</b>${status}</div>
      <div class="runs">${runTags}</div>
      <p>${esc(c.capture_note || c.note)}</p>${diff}
    </div>`;
      }).join("");
      return `
    <section id="consistency">
      <h2>Output consistency</h2>
      <p class="lede">The same input, run three times. Identical runs produce byte-identical files; any difference is shown cell by cell.</p>
      <div class="cons">${cards}</div>
      <p class="short">Not enough files to compare: ${notEnough.join(", ")}. These stopped or produced a single file.</p>
    </section>`;
    }

    function heatmap(D) {
      const byId = Object.fromEntries(D.scenarios.map(s => [s.id, s]));
      const rows = D.heat.map(h => {
        const hasOutput = ((byId[h.id] || {}).runs || []).some(r => r.output_file);
        const cell = (cls, text) => `<td class="cell ${cls}">${text}</td>`;
        const stopped = h.stops ? cell("good", "Yes") : cell("neutral", "No");
        const reported = !hasOutput ? cell("neutral", "No") : h.data_correct ? cell("good", "Yes") : cell("bad", "Yes, wrongly");
        const correct = !hasOutput ? cell("neutral", "No file") : h.data_correct ? cell("good", "Yes") : cell("bad", "No");
        const caught = (h.data_correct || !hasOutput) ? cell("neutral", "n/a") : h.validator_caught ? cell("good", "Yes") : cell("bad", "No");
        return `<tr><td class="scen"><b>${esc(h.label)}</b></td>${stopped}${reported}${correct}${caught}
      <td><span class="tag ${esc(h.capability)}">${esc(cap(h.headline))}</span></td></tr>`;
      }).join("");
      return `
    <section id="heat">
      <h2>Capability heat map</h2>
      <p class="lede">Which changes Rhombus handles, which break it, and which it misses. Green is a safe outcome; red is wrong data reaching the destination.</p>
      <div class="panel scroll heat"><table>
        <thead><tr><th>Scenario</th><th>Stopped the run</th><th>Reported success</th><th>Data correct</th><th>Caught by our validator</th><th>Verdict</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    </section>`;
    }

    function timing(D) {
      const all = D.scenarios.flatMap(s => s.times_to_output || []);
      const scale = Math.max(30, Math.ceil(Math.max(...all, 1) / 30) * 30);
      const pos = v => (v / scale) * 100;
      const rows = D.scenarios.map(s => {
        const t = s.times_to_output || [];
        const base = s.group === "baseline" ? " base" : "";
        if (!t.length) return `<div class="timeRow${base}"><div class="label">${esc(s.label)}</div><div style="color:var(--muted);font-size:13px">Stopped, no file to time</div><div></div></div>`;
        const m = median(t);
        return `<div class="timeRow${base}"><div class="label">${esc(s.label)}</div>
      <div class="track">${t.map(v => `<i class="dot" style="left:${pos(v)}%" title="${v} s"></i>`).join("")}<i class="med" style="left:${pos(m)}%" title="median ${m} s"></i></div>
      <div class="num">${m} s</div></div>`;
      }).join("");
      const ticks = Array.from({ length: scale / 30 + 1 }, (_, i) => `<span>${i * 30} s</span>`).join("");
      return `
    <section id="time">
      <h2>Time from trigger to output</h2>
      <p class="lede">Each dot is one run; the dark bar is the median. Baseline first, then each drift scenario.</p>
      <div class="panel">${rows}<div class="axis"><span></span><div class="ticks">${ticks}</div><span class="num">median</span></div></div>
      <p class="note">Measured from pressing Enter in the runner to the new file appearing in <code>gs://rhombus-target</code>. Runs were triggered by hand, so times include selecting the dataset in Rhombus: compare scenarios with each other, not as pure pipeline durations. In one UI test run, Rhombus logged "completed successfully" about two minutes before the file existed.</p>
    </section>`;
    }

    function videos(D) {
      const recs = (D.videos || []).map((v, i) => `<button data-i="${i}">${esc(recTitle(v))}</button>`).join("");
      return `
    <section id="videos">
      <h2>Videos</h2>
      <p class="lede">Walkthroughs of the automated tests, and a recording of each UI test.</p>
      <div class="vids">${WALKTHROUGHS.map(w => `
        <div class="vid"><b>${esc(w.title)}</b><div>${esc(w.about)}</div><video controls preload="metadata" src="${w.url}"></video></div>`).join("")}
      </div>
      ${recs ? `<p class="recsTitle">UI test recordings</p><div class="recs">${recs}</div>` : ""}
    </section>`;
    }

    function allRuns(D) {
      const label = Object.fromEntries(D.scenarios.map(s => [s.id, s.label]));
      const rows = D.runs.map(r => {
        const v = (r.verdict || "").split(" ")[0];
        const note = r.rhombus_error ? "Rhombus: " + r.rhombus_error.slice(0, 80) + "…" : (r.notes || "");
        return `<tr><td>${esc(label[r.case_id] || r.case_id)}</td><td class="num">${esc(r.run)}</td>
      <td>${esc(r.pipeline)}</td><td><span class="vtag ${esc(v)}">${esc(r.verdict || "")}</span></td>
      <td class="num">${r.seconds ?? ""}</td><td style="color:var(--muted);font-size:13px">${esc(note)}</td></tr>`;
      }).join("");
      return `
    <section>
      <details class="all"><summary>All ${D.runs.length} runs</summary>
        <div class="panel scroll" style="margin-top:14px"><table>
          <thead><tr><th>Scenario</th><th class="num">Run</th><th>Pipeline</th><th>Validator</th><th class="num">Seconds</th><th>Notes</th></tr></thead>
          <tbody>${rows}</tbody>
        </table></div>
      </details>
    </section>`;
    }

    function bindPlayer(D) {
      const dlg = document.getElementById("player"), vid = document.getElementById("playerVideo");
      document.querySelectorAll(".recs button").forEach(b => b.addEventListener("click", () => {
        const v = D.videos[+b.dataset.i];
        document.getElementById("playerTitle").textContent = recTitle(v);
        vid.src = v.file;
        dlg.showModal();
        vid.play().catch(() => { });
      }));
      document.getElementById("playerClose").addEventListener("click", () => { vid.pause(); dlg.close(); });
      dlg.addEventListener("close", () => vid.pause());
    }

    fetch("data.json", { cache: "no-store" })
      .then(r => { if (!r.ok) throw new Error(`data.json returned ${r.status}`); return r.json(); })
      .then(D => {
        document.getElementById("app").innerHTML =
          hero(D) + health(D) + consistency(D) + heatmap(D) + timing(D) + videos(D) + allRuns(D) +
          `<footer>Data from every test run, checked against the known correct output. Source and method: <a target="_blank" href="https://github.com/bishwakumar/rhombus-ai">GitHub repository</a>.</footer>`;
        bindPlayer(D);
      })
      .catch(e => {
        document.getElementById("app").innerHTML = `<p class="err">Couldn't load the results (${esc(e.message)}). Open this page through a web server, for example <code>python3 dashboard/serve.py</code>, not as a local file.</p>`;
      });
  </script>
</body>

</html>
